$schema: https://json-schema.org/draft/2020-12/schema
$id: shelf.schema.yml
title: Shelf
type: object
required: [title, description, images, artifacts]
additionalProperties: false
properties:
  title: { $ref: "#/$defs/text" }
  description: { $ref: "#/$defs/text" }
  images:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/shelfImage" }
  artifacts:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/artifact" }

$defs:
  text: { type: string, minLength: 1 }

  shelfImage:
    type: object
    required: [url, altText, caption, label]
    additionalProperties: false
    properties:
      url: { type: string, pattern: "^assets/.+\\.jpe?g$" }
      altText: { $ref: "#/$defs/text" }
      caption: { $ref: "#/$defs/text" }
      label: { $ref: "#/$defs/text" }

  artifact:
    type: object
    required: [metaDescription, images, audioDescription]
    additionalProperties: false
    properties:
      metaDescription: { $ref: "#/$defs/metaDescription" }
      images:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/image" }
      obj3D: { $ref: "#/$defs/object3D" }
      audioDescription: { $ref: "#/$defs/audioDescription" }

  metaDescription:
    type: object
    required: [name, accNo, material, dimension, details]
    additionalProperties: false
    properties:
      name: { $ref: "#/$defs/text" }
      accNo: { $ref: "#/$defs/text" }
      material: { $ref: "#/$defs/text" }
      dimension:
        type: array
        minItems: 3
        maxItems: 3
        items: { type: number }
      details: { $ref: "#/$defs/text" }

  image:
    type: object
    required: [url, altText, caption]
    additionalProperties: false
    properties:
      url: { type: string, pattern: "^assets/.+\\.jpe?g$" }
      altText: { $ref: "#/$defs/text" }
      caption: { $ref: "#/$defs/text" }

  object3D:
    type: object
    required: [url, altText]
    additionalProperties: false
    properties:
      url: { type: string, pattern: "^https://" }
      altText: { $ref: "#/$defs/text" }

  audioDescription:
    type: object
    required: [url, transcript]
    additionalProperties: false
    properties:
      url: { $ref: "#/$defs/text" }
      transcript: { $ref: "#/$defs/text" }
