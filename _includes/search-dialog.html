<dialog id="search-dialog" class="search-dialog" aria-labelledby="search-dialog-title">
  <div class="search-dialog__head">
    <h2 id="search-dialog-title" class="search-dialog__title">Search exhibition</h2>
    <button id="search-close" class="search-dialog__close" type="button" aria-label="Close search dialog">
      {%- include icon.html name="x" class="icon" size=18 -%}
      <span>Close</span>
    </button>
  </div>

  <search>
    <form class="search-dialog__form" role="search" onsubmit="return false;">
      <label class="search-dialog__label" for="search-input">Search by object number, name, accession number, material, or page</label>
      <input id="search-input"
             class="search-dialog__input"
             type="search"
             name="q"
             autocomplete="off"
             placeholder="Try: Pelike, MU4759, bronze, Pataikos, or Auslan">
    </form>
  </search>

  <p id="search-status" class="search-dialog__status" role="status" aria-live="polite"></p>
  <ul id="search-results" class="search-results" aria-label="Search results"></ul>
</dialog>
