<dialog id="photo-dialog" class="photo-viewer" aria-labelledby="photo-dialog-title">
  <div class="photo-viewer__bar">
    <div class="photo-viewer__heading-wrap">
      <h2 class="photo-viewer__title" id="photo-dialog-title">Photo viewer</h2>
      <p class="photo-viewer__count" role="status" aria-live="polite" data-pv-count></p>
    </div>

    <div class="photo-viewer__toolbar">
      <div class="photo-viewer__zoom" role="group" aria-label="Zoom controls">
        <button type="button" class="photo-viewer__btn" data-pv-zoom="out" aria-label="Zoom out" aria-disabled="true">
          {%- include icon.html name="zoom-out" class="icon" size=18 -%}
          <span class="photo-viewer__btn-label">Zoom out</span>
        </button>
        <button type="button" class="photo-viewer__btn" data-pv-zoom="in" aria-label="Zoom in" aria-disabled="false">
          {%- include icon.html name="zoom-in" class="icon" size=18 -%}
          <span class="photo-viewer__btn-label">Zoom in</span>
        </button>
        <button type="button" class="photo-viewer__btn" data-pv-zoom="reset" aria-label="Reset view" aria-disabled="true">
          {%- include icon.html name="rotate-ccw" class="icon" size=18 -%}
          <span class="photo-viewer__btn-label">Reset view</span>
        </button>
      </div>

      <button type="button" class="photo-viewer__btn photo-viewer__close" data-pv-close aria-label="Close photo viewer">
        {%- include icon.html name="x" class="icon" size=18 -%}
        <span>Close</span>
      </button>
    </div>
  </div>

  <div class="photo-viewer__stage" data-pv-stage>
    <button type="button" class="photo-viewer__step photo-viewer__prev" data-pv-prev aria-label="Previous photo">
      {%- include icon.html name="chevron-left" class="icon" size=24 -%}
    </button>
    <button type="button" class="photo-viewer__step photo-viewer__next" data-pv-next aria-label="Next photo">
      {%- include icon.html name="chevron-right" class="icon" size=24 -%}
    </button>

    <div class="photo-viewer__pan" role="group" aria-label="Pan zoomed photograph" data-pv-pan>
      <button type="button" class="photo-viewer__pan-btn photo-viewer__pan-btn--up" data-pv-pan-dir="up" aria-label="Pan up" aria-disabled="true">
        {%- include icon.html name="arrow-up" class="icon" size=18 -%}
      </button>
      <button type="button" class="photo-viewer__pan-btn photo-viewer__pan-btn--left" data-pv-pan-dir="left" aria-label="Pan left" aria-disabled="true">
        {%- include icon.html name="arrow-left" class="icon" size=18 -%}
      </button>
      <button type="button" class="photo-viewer__pan-btn photo-viewer__pan-btn--right" data-pv-pan-dir="right" aria-label="Pan right" aria-disabled="true">
        {%- include icon.html name="arrow-right" class="icon" size=18 -%}
      </button>
      <button type="button" class="photo-viewer__pan-btn photo-viewer__pan-btn--down" data-pv-pan-dir="down" aria-label="Pan down" aria-disabled="true">
        {%- include icon.html name="arrow-down" class="icon" size=18 -%}
      </button>
    </div>
  </div>

  <div class="photo-viewer__foot">
    <p class="photo-viewer__caption" data-pv-caption></p>
    <p class="photo-viewer__keys" aria-hidden="true">
      <span><kbd>←</kbd><kbd>→</kbd> Photos or pan</span>
      <span><kbd>+</kbd><kbd>−</kbd> Zoom</span>
      <span><kbd>0</kbd> Reset</span>
      <span><kbd>Esc</kbd> Close</span>
    </p>
  </div>
  <p class="visually-hidden" role="status" aria-live="polite" data-pv-status></p>
</dialog>
