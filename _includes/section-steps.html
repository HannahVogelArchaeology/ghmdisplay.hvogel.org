<div class="steps" role="group" aria-label="Page sections" hidden>
  <p class="steps__label" id="steps-hint" aria-hidden="true"></p>
  <button type="button" class="steps__button steps__top" aria-label="Back to top" aria-keyshortcuts="Shift+ArrowUp" data-kg-keys="Shift+↑" data-kg-label="Back to top">
    {%- include icon.html name="arrow-up-to-line" size=20 -%}
  </button>
  <button type="button" class="steps__button steps__prev" aria-label="Previous section">
    {%- include icon.html name="chevron-up" size=20 -%}
  </button>
  <button type="button" class="steps__button steps__next" aria-label="Next section">
    {%- include icon.html name="chevron-down" size=20 -%}
  </button>
</div>
