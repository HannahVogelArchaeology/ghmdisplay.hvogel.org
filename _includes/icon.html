{%- assign size = include.size | default: 24 -%}
<svg{% if include.class %} class="{{ include.class }}"{% endif %} aria-hidden="true" focusable="false" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="{{ '/assets/icons/' | append: include.name | append: '.svg#icon' | relative_url }}"/></svg>
