<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-AU' }}"
      data-font="lexend"
      data-spacing="default"
      data-text-size="100"
      data-analytics-custom-events="{{ site.analytics.custom_events | default: false }}"
      data-kiosk-idle="{{ site.kiosk.idle_seconds | default: 300 }}"
      data-kiosk-warning="{{ site.kiosk.warning_seconds | default: 20 }}">
  {%- include head.html -%}
  <body class="layout-{{ page.layout | default: 'page' }}">
    <a class="skip-link" href="#main">Skip to main content</a>
    {%- include header.html -%}
    {%- include a11y-panel.html -%}
    {%- include search-dialog.html -%}
    <main id="main" tabindex="-1">
      {{ content }}
    </main>
    {%- include section-steps.html -%}
    {%- include footer.html -%}
  </body>
</html>
