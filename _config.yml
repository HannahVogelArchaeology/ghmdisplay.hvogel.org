title: "Disability Heritage: Archaeology with Difference"
description: >-
  Disability is part of our history, yet archaeology often overlooks disabled experiences.
  Online exhibition at Macquarie University's Gale History Museum.
lang: en-AU
url: "https://ghmdisplay.hvogel.org"
baseurl: ""
repository: HannahVogelArchaeology/ghmdisplay.hvogel.org

author:
  name: Hannah Vogel
  type: Person

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og/home.jpg
        width: 1200
        height: 630
        alt: "Disability Heritage: Archaeology with Difference, curated by Hannah Vogel at the Gale History Museum, Macquarie University, alongside a photograph of the exhibition display."

header_pages:
  - pages/index.md
  - pages/shelves/top.md
  - pages/shelves/middle.md
  - pages/shelves/bottom.md
  - pages/curation.md

shelves: [top, middle, bottom]

kiosk:
  idle_seconds: 300
  warning_seconds: 20

analytics:
  enabled: true
  custom_events: false

image_sizes: [400, 800, 1600]

kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - ACCESSIBILITY.md
  - AGENTS.md
  - CITATION.cff
  - CLAUDE.md
  - CONTRIBUTORS.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - NOTICE.md
  - README.md
  - Rakefile
  - _scripts
  - docs
  - node_modules
  - tests
